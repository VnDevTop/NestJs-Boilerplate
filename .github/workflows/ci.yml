name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancels an in-flight run for the same ref, so a force push does not queue up
# several redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned rather than `ubuntu-latest`, on purpose.
#
# GitHub announces that the `ubuntu-latest` label migrates to Ubuntu 26
# starting 19 October 2026, which would move every job here without a commit.
# A pinned label is the same image on a Tuesday and on a Saturday, so a CI
# failure is a change in this repository rather than a change in the runner.
#
# Bump it deliberately, as its own commit, when the image you are pinned to is
# itself retired — which is the moment a pin becomes the problem.
env:
  NODE_VERSION: 24

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      # `checkout@v7` and `setup-node@v7` are the first majors that run on
      # Node 24. The v4s this replaced target Node 20, which GitHub has
      # deprecated: they still work, forced onto a newer runtime, and warn on
      # every single run. A warning on every run is a warning nobody reads.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: verify

    # The suite starts its own postgres and redis through testcontainers, which
    # talks to the runner's docker daemon directly. A service container would be a
    # second way to get the same two processes and one more thing to keep in step
    # with `test/e2e/global-setup.ts`.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: End to end
        # No `E2E_NO_CONTAINERS`, and no continue-on-error: a suite that cannot
        # reach its containers is a failure, not a skip. Without the flag the
        # specs would skip themselves and this job would report success on
        # nothing, which is the failure mode the flag exists to prevent.
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-24.04
    needs: verify

    steps:
      - uses: actions/checkout@v7

      # buildx v4 and build-push v7 are the Node 24 majors; v3 and v6 are the
      # Node 20 ones GitHub deprecated.
      - uses: docker/setup-buildx-action@v4

      # Build only: publishing needs registry credentials this template does not
      # assume, so pushing is left to whoever owns the registry.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nestjs-boiler-plate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
