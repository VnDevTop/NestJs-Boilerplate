# Local development stack: Postgres, Valkey and the app itself.
#
#   cp .env.example .env
#   docker compose up --build
#
# The app is exposed on 3000 and Swagger on http://localhost:3000/docs.
# Migrations run before the server starts, so a fresh volume gets a schema.

name: nestjs-boilerplate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_boilerplate
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The app must not start against a database that is still initialising.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_boilerplate']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # An in-memory dataset is the point for a cache: persistence would only make
    # a stale entry survive a restart.
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nestjs_boilerplate
      DATABASE_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nestjs_boilerplate
      DATABASE_SSL: 'false'
      CACHE_BACKEND: valkey
      CACHE_URL: redis://valkey:6379/0
      CACHE_KEY_PREFIX: nestjs_boilerplate
      # Real secrets, not the example values. The validator rejects a production
      # boot with a placeholder, and these are not production either way.
      JWT_SECRET: local-development-jwt-secret-change-me-32
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-32
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      TWO_FACTOR_ENABLED: 'true'
      TWO_FACTOR_ENCRYPTION_KEY: local-development-2fa-key-change-me-32
      TWO_FACTOR_ISSUER: NestJS Boilerplate
      SWAGGER_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Long enough for SIGTERM to reach node and for in-flight requests to finish.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
